name: Build IPA from zip
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      APP_VARIANT: showcase
      EXPO_PUBLIC_DEMO: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unzip project
        run: |
          unzip -q habibi-gains-ipa-kit.zip -d src
          echo "PROJ=$PWD/src/habibi-gains" >> $GITHUB_ENV
      - name: Fix config
        working-directory: ${{ env.PROJ }}
        run: |
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('base-config.json','utf8'));const n=c.plugins.map(x=>Array.isArray(x)?x[0]:x);for(const p of ['expo-image','expo-sharing','expo-status-bar','expo-web-browser']){if(!n.includes(p))c.plugins.push(p)}fs.writeFileSync('base-config.json',JSON.stringify(c,null,2))"
      - name: Install
        working-directory: ${{ env.PROJ }}
        run: |
          npm install --legacy-peer-deps
          npx expo install --fix -- --legacy-peer-deps || true
      - name: Prebuild
        working-directory: ${{ env.PROJ }}
        run: npx expo prebuild --platform ios --clean --no-install
      - name: Pods
        working-directory: ${{ env.PROJ }}/ios
        run: pod install
      - name: Build
        working-directory: ${{ env.PROJ }}
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -n 1)
          SCHEME=$(basename "$WS" .xcworkspace)
          set -o pipefail
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -n 200
      - name: Package
        working-directory: ${{ env.PROJ }}
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -qry $GITHUB_WORKSPACE/HG-Showcase.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: HG-Showcase-ipa
          path: HG-Showcase.ipa
