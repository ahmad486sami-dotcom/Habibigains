name: Build IPA from zip

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      APP_VARIANT: showcase
      EXPO_PUBLIC_DEMO: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unzip project
        run: |
          ZIP=$(ls *.zip | head -n 1)
          echo "Using $ZIP"
          mkdir -p src && unzip -q -o "$ZIP" -d src
          APPDIR=$(dirname "$(find src -name package.json -not -path '*/node_modules/*' | head -n 1)")
          echo "APPDIR=$APPDIR" >> $GITHUB_ENV

      - name: Install
        working-directory: ${{ env.APPDIR }}
        run: |
          node -e "const f='base-config.json',c=require('./'+f);c.expo=c.expo||c;const p=(c.expo.plugins=c.expo.plugins||[]);for(const n of ['expo-image','expo-sharing','expo-status-bar','expo-web-browser']) if(!p.some(x=>(Array.isArray(x)?x[0]:x)===n)) p.push(n);require('fs').writeFileSync(f,JSON.stringify(c,null,2))" || true
          npm install --legacy-peer-deps
          npx expo install --fix -- --legacy-peer-deps || true

      - name: Prebuild iOS
        working-directory: ${{ env.APPDIR }}
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Pods
        working-directory: ${{ env.APPDIR }}/ios
        run: pod install

      - name: Build
        working-directory: ${{ env.APPDIR }}
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -n 1)
          SCHEME=$(basename "$WS" .xcworkspace)
          set +e
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          CODE=$?
          if [ $CODE -ne 0 ]; then
            echo "================ REAL ERRORS (screenshot this) ================"
            grep -E "error:|fatal error|Error:|❌|failed with" build.log | grep -v "warning:" | sort -u | head -40
            echo "================ END ================"
            exit $CODE
          fi

      - name: Package
        working-directory: ${{ env.APPDIR }}
        run: |
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -n 1)
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry "$GITHUB_WORKSPACE/HG-Showcase.ipa" Payload

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: HG-Showcase-ipa
          path: HG-Showcase.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: ${{ env.APPDIR }}/build.log
